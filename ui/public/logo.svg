<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Wada gate roundel. A darwaza silhouette in an ink circle, where the
       arch's negative space is also a map-pin teardrop: the two things this
       project is at once, an old city and a map of it. Drawn to read at 16px
       as a favicon, so nothing here is thinner than 2 units. -->
  <circle cx="32" cy="32" r="30" fill="#f6f0e1" stroke="#2b2440" stroke-width="2.5"/>

  <!-- flanking bastions + crenellated parapet -->
  <path fill="#2b2440" d="
    M13 50 V27 h6 v-4 h5 v4 h4 V19 h8 v8 h4 v-4 h5 v4 h6 v23 z
  "/>
  <!-- the plinth the gate stands on -->
  <rect x="10" y="50" width="44" height="4" fill="#2b2440"/>

  <!-- the arch: a pointed doorway whose lower half tapers to a pin tip -->
  <path fill="#e8a33d" d="
    M32 25
    c 6 0 9 4.5 9 10
    c 0 6.5 -6 10.5 -9 15
    c -3 -4.5 -9 -8.5 -9 -15
    c 0 -5.5 3 -10 9 -10 z
  "/>
  <!-- the pin's eye, which is also the lamp above the door -->
  <circle cx="32" cy="34" r="3.2" fill="#2b2440"/>
</svg>
